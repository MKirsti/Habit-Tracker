<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Questlog</title>
  <!--
    Questlog-Wappen: goldgerandeter Schild mit aufgeschlagenem Buch und Stern.
    Quelle für alle PNG-Icons (scripts/generate-icons.cjs). Die IDs backdrop, frame und crest
    werden vom Skript verwendet. Gleiche Geometrie wie die Komponente Crest in src/app/AppLogo.tsx.
  -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="72%">
      <stop offset="0" stop-color="#2d2116"/>
      <stop offset="0.55" stop-color="#16100b"/>
      <stop offset="1" stop-color="#0a0705"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2e2318"/>
      <stop offset="1" stop-color="#120d09"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f6d78a"/>
      <stop offset="0.5" stop-color="#d4a548"/>
      <stop offset="1" stop-color="#8f6b2c"/>
    </linearGradient>
    <linearGradient id="page" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f6ecd6"/>
      <stop offset="1" stop-color="#d8c49c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0c96a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f0c96a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect id="backdrop" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect id="frame" x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#d4a548" stroke-opacity="0.3" stroke-width="5"/>

  <g id="crest" transform="translate(256 256) scale(1.1) translate(-256 -262)">
    <path d="M256 82Q322 112 388 112L388 248C388 336 332 404 256 442C180 404 124 336 124 248L124 112Q190 112 256 82Z" fill="url(#shield)" stroke="url(#rim)" stroke-width="16" stroke-linejoin="round"/>
    <path d="M256 82Q322 112 388 112L388 248C388 336 332 404 256 442C180 404 124 336 124 248L124 112Q190 112 256 82Z" fill="none" stroke="#d4a548" stroke-opacity="0.45" stroke-width="3.5" stroke-linejoin="round" transform="translate(256 262) scale(0.86) translate(-256 -262)"/>
    <circle cx="256" cy="194" r="62" fill="url(#glow)"/>
    <path d="M256 148Q261.5 188.5 298 194Q261.5 199.5 256 240Q250.5 199.5 214 194Q250.5 188.5 256 148Z" fill="#f6d78a"/>
    <path d="M256 298C226 282 188 278 148 284L148 362C188 356 226 362 256 378C286 362 324 356 364 362L364 284C324 278 286 282 256 298Z" fill="#b8892f"/>
    <path d="M256 284C230 266 196 260 160 266L160 346C196 340 230 346 256 364Z" fill="url(#page)"/>
    <path d="M256 284C282 266 316 260 352 266L352 346C316 340 282 346 256 364Z" fill="url(#page)"/>
    <path d="M256 284L256 364" stroke="#8f6b2c" stroke-width="4" stroke-linecap="round"/>
    <g fill="none" stroke="#a88a58" stroke-width="4" stroke-linecap="round" opacity="0.7">
      <path d="M178 286C200 282 222 285 240 294"/>
      <path d="M178 306C200 302 222 305 240 314"/>
      <path d="M178 326C200 322 222 325 240 334"/>
      <path d="M272 294C290 285 312 282 334 286"/>
      <path d="M272 314C290 305 312 302 334 306"/>
      <path d="M272 334C290 325 312 322 334 326"/>
    </g>
  </g>
</svg>
