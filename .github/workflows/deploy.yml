name: Deploy to GitHub Pages

# Baut die App und veröffentlicht sie auf GitHub Pages – aber nur vom Standard-Branch des Repos.
# Einmalig nötig (sonst scheitert schon „Setup Pages“): Repository → Settings → Pages →
# Build and deployment → Source: „GitHub Actions“. Details im README.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Prüft gleich zu Beginn, ob GitHub Pages für das Repository eingeschaltet ist (siehe oben).
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Nur ein Deployment zur Zeit, und ein laufendes wird nie abgebrochen – ein neueres wartet.
    # Auf Job-Ebene, damit Pushes auf andere Branches (Build übersprungen) die Gruppe gar nicht betreten.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
